{% extends "base.html" %}
{% set active = "logs" %}
{% block title %}Bot Logs{% endblock %}
{% block page_title %}Bot Logs{% endblock %}

{% block content %}
<div class="toolbar">
  <button class="fbtn on" data-lvl=""     onclick="setFilter('',this)">All</button>
  <button class="fbtn"    data-lvl="ERROR" onclick="setFilter('ERROR',this)">Error</button>
  <button class="fbtn"    data-lvl="WARN"  onclick="setFilter('WARN',this)">Warn</button>
  <button class="fbtn"    data-lvl="INFO"  onclick="setFilter('INFO',this)">Info</button>
  <button class="fbtn"    data-lvl="EXEC"  onclick="setFilter('EXEC',this)">Exec only</button>

  <input class="search" id="search" placeholder="Search logs..."
         oninput="debounceSearch()" />

  <label style="font-size:12px;color:var(--muted);margin-left:8px">
    Tail lines:
    <select id="tail-lines" onchange="reload()" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;margin-left:4px">
      <option value="500">500</option>
      <option value="1000">1 000</option>
      <option value="2000" selected>2 000</option>
      <option value="5000">5 000</option>
    </select>
  </label>

  <span class="loading" id="status" style="margin-left:8px">—</span>
</div>

<div class="log-wrap" id="lw"></div>

<div class="pagination">
  <button id="btn-first" onclick="goPage(1)"            disabled>«</button>
  <button id="btn-prev"  onclick="goPage(curPage-1)"    disabled>‹</button>
  <span   class="pg-info" id="pg-info">—</span>
  <button id="btn-next"  onclick="goPage(curPage+1)"    disabled>›</button>
  <button id="btn-last"  onclick="goPage(totalPages)"   disabled>»</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js"></script>
{% endblock %}
